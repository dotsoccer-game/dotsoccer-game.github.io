<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d6b32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ドットサッカー"><title>ゴールとボール</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"><link rel="stylesheet" href="style.css?v=20261008-340"></head>
<body><main id="app">
 <header><div class="brand"><span class="crest">H</span><div><b>はじまりFC</b><small>タイプで動きが変わる、90分。</small></div></div><div class="head-btns"><button id="goCareer" class="quiet">育成モード</button><button id="newGame" class="quiet">フリー試合</button></div></header>
