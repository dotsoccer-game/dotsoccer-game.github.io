<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>キャッチの絵の研究</title>
<style>
:root{--bg:#2f8a3a;--panel:#10241a;--ink:#f3f6ef;--mut:#a9c3ad;--acc:#ffe05a}
*{box-sizing:border-box}body{margin:0;background:var(--panel);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{display:grid;grid-template-columns:1fr 310px;gap:10px;padding:10px;min-height:100vh}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:6px}}
canvas{width:100%;background:var(--bg);border-radius:8px;image-rendering:pixelated;display:block;touch-action:none}
.side{display:flex;flex-direction:column;gap:8px;font-size:13px}
h1{font-size:16px;margin:0}h2{font-size:13px;margin:6px 0 2px;color:var(--mut)}
button{font:inherit;background:#2c4a36;color:var(--ink);border:1px solid #4d7a5a;border-radius:6px;padding:7px 4px;cursor:pointer}
button.on{background:var(--acc);color:#222;border-color:var(--acc)}
.row{display:flex;gap:4px;flex-wrap:wrap}.row button{flex:1}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.pal button{height:32px;font-size:10px;padding:0;color:#fff;text-shadow:0 1px 2px #000}
.info{background:#0b1a12;border-radius:6px;padding:8px;line-height:1.6;font-size:12px;white-space:pre-wrap}
textarea{width:100%;height:80px;background:#0b1a12;color:var(--ink);border:1px solid #4d7a5a;border-radius:6px;font:11px ui-monospace,Menlo,monospace}
#ed{display:none}#ed.on{display:block}
</style></head><body>
<div class="wrap">
 <div>
  <canvas id="cv" width="900" height="640"></canvas>
  <canvas id="ed" width="900" height="560"></canvas>
 </div>
 <div class="side">
  <h1>キャッチの絵 研究画面</h1>
  <div>正面に来たボールを、GKが腰を落として抱える絵です。ゲームと同じ描き方（体の絵 → 試合と同じボール → ボールの上の手）で、4つの向きを同時に動かします。上の段は大きく、下の段はゲームと同じ大きさです。</div>
  <h2>動き</h2>
  <div class="row" id="ph"></div>
  <div class="row" id="spd"></div>
  <div class="row"><button id="pause">一時停止</button><button id="restart">最初から</button><button id="mirror">左右反転：オフ</button></div>
  <h2>本家の正面キャッチ（いただいた画像・動画より）</h2>
  <div class="info">・こちら（ボールが来た方）を向いて、ひざを曲げ、足を開いて腰を落とす。
・ボールを体の横・腰の高さで抱える。片手はボールの下、もう片方の手（手袋）は胸の横。
・ボールは試合のボールと同じ見た目（ドット絵ではない、なめらかな球）。</div>
  <h2>絵を直す</h2>
  <div class="row"><button id="edOn">絵を直す画面を開く</button></div>
  <div id="edUi" style="display:none">
   <div class="row" id="dir"></div>
   <div class="row" id="stg" style="margin-top:4px"></div>
   <div class="pal" id="pal" style="margin-top:4px"></div>
   <div class="row" style="margin-top:4px"><button id="undo">1つ戻す</button><button id="reset">最初に戻す</button><button id="exp">書き出す</button></div>
   <textarea id="out" readonly placeholder="「書き出す」を押すと、直した絵が文字で出ます。コピーして送ってください。"></textarea>
  </div>
 </div>
</div>

function layer(c, rows, x, y, k, flip, front, H) {   // x,y：足もと。front：ボールの上に重ねる手だけ

function ball(c, cx, cy, R, rot) {

function gk(c, key, x, y, k, ph, bp, flip) {

    const u = bp, fx = bx + (key === 'side' ? (flip ? -1 : 1) * 70 * k / 6 * (1 - u) : 0), fy = by - 6 * k * (1 - u) * (1 - u) - 20 * k / 6 * (1 - u), fr = R * (0.45 + 0.55 * u);

function scene() {

  });
  ctx.textAlign = 'left'; ctx.fillStyle = '#ffe05a'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(ph === 'ready' ? '構え：ボールが来る' : '抱える', 16, 34);
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = '16px sans-serif'; ctx.fillText('↑ 大きく（7倍）', 16, 420); ctx.fillText('↓ ゲームと同じ大きさ', 16, 470);

// 絵を直す画面
const ed = document.getElementById('ed'), ex = ed.getContext('2d'); let eDir = 'front', eStg = 'hold', paint = 'o'; const hist = [];
const EK = 16, EX = 20, EY = 40;
function editor() {

  ex.fillStyle = '#10241a'; ex.fillRect(0, 0, ed.width, ed.height);

function frame(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; if (!paused) t += dt * speed; scene(); editor(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function at(ev) { const rc = ed.getBoundingClientRect(), x = (ev.clientX - rc.left) * ed.width / rc.width, y = (ev.clientY - rc.top) * ed.height / rc.height; const rows = DATA[eDir][eStg]; const c = Math.floor((x - EX) / EK), r = Math.floor((y - EY) / EK); if (r < 0 || c < 0 || r >= rows.length || c >= 27) return null; return [r, c]; }

const mk = (id, list, cur, set) => { const el = document.getElementById(id); el.innerHTML = list.map(([k, n]) => `<button data-k="${k}" class="${k === cur ? 'on' : ''}">${n}</button>`).join(''); el.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; set(b.dataset.k); el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); }; };
mk('ph', [['auto', '流す（構え→抱える）'], ['ready', '構えで止める'], ['hold', '抱えるで止める']], 'auto', (k) => { phase = k; });
mk('spd', [['1', 'ふつう'], ['0.4', 'ゆっくり'], ['0.15', 'とてもゆっくり']], '1', (k) => { speed = +k; });
mk('dir', DIRS, eDir, (k) => { eDir = k; }); mk('stg', [['hold', '抱える'], ['ready', '構え']], eStg, (k) => { eStg = k; });
{ const el = document.getElementById('pal'); el.innerHTML = Object.keys(NAMES).map((k) => `<button data-k="${k}" style="background:${PAL[k] || 'repeating-linear-gradient(45deg,#666 0 4px,#999 4px 8px)'}" class="${k === paint ? 'on' : ''}">${NAMES[k]}</button>`).join(''); el.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; paint = b.dataset.k; el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); }; }
document.getElementById('pause').onclick = (e) => { paused = !paused; e.target.textContent = paused ? '再生' : '一時停止'; };
document.getElementById('restart').onclick = () => { t = 0; };
document.getElementById('mirror').onclick = (e) => { mirror = !mirror; e.target.textContent = '左右反転：' + (mirror ? 'オン' : 'オフ'); e.target.classList.toggle('on', mirror); };
document.getElementById('edOn').onclick = (e) => { const on = !ed.classList.contains('on'); ed.classList.toggle('on', on); document.getElementById('edUi').style.display = on ? '' : 'none'; e.target.textContent = on ? '絵を直す画面を閉じる' : '絵を直す画面を開く'; if (on) ed.scrollIntoView({ behavior: 'smooth' }); };
document.getElementById('undo').onclick = () => { const h = hist.pop(); if (h) DATA[h[0]][h[1]] = h[2]; };
document.getElementById('reset').onclick = () => { hist.push([eDir, eStg, DATA[eDir][eStg].slice()]); DATA[eDir][eStg] = DATA0[eDir][eStg].slice(); };
document.getElementById('exp').onclick = () => { const o = document.getElementById('out'); o.value = JSON.stringify({ dir: eDir, stage: eStg, rows: DATA[eDir][eStg] }); o.select(); try { navigator.clipboard.writeText(o.value); } catch (_) {} };
</script>
</body></html>
