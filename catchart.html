<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>キャッチの絵の研究</title>
<style>
:root{--bg:#2f8a3a;--panel:#10241a;--ink:#f3f6ef;--mut:#a9c3ad;--acc:#ffe05a}
*{box-sizing:border-box}body{margin:0;background:var(--panel);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{display:grid;grid-template-columns:1fr 310px;gap:10px;padding:10px;min-height:100vh}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
canvas{width:100%;background:var(--bg);border-radius:8px;image-rendering:pixelated;display:block;touch-action:none}
.side{display:flex;flex-direction:column;gap:8px;font-size:13px}
h1{font-size:16px;margin:0}h2{font-size:13px;margin:6px 0 2px;color:var(--mut)}
button{font:inherit;background:#2c4a36;color:var(--ink);border:1px solid #4d7a5a;border-radius:6px;padding:6px 4px;cursor:pointer}
button.on{background:var(--acc);color:#222;border-color:var(--acc)}
.row{display:flex;gap:4px;flex-wrap:wrap}.row button{flex:1}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.pal button{height:34px;font-size:10px;padding:0;color:#fff;text-shadow:0 1px 2px #000}
.info{background:#0b1a12;border-radius:6px;padding:8px;line-height:1.6;font-size:12px;white-space:pre-wrap}
textarea{width:100%;height:90px;background:#0b1a12;color:var(--ink);border:1px solid #4d7a5a;border-radius:6px;font:11px ui-monospace,Menlo,monospace}
</style></head><body>
<div class="wrap">
 <canvas id="cv" width="960" height="600"></canvas>
 <div class="side">
  <h1>キャッチの絵 研究画面</h1>
  <div>左：絵を1ドットずつ直せる大きな絵（タップで塗る）。右：ボールが飛んで来て、GKが「構え → 受ける → 抱える」と動く様子を、ゲームと同じ大きさと4倍で流します。</div>
  <h2>体の向き</h2><div class="row" id="dir"></div>
  <h2>直す絵（段階）</h2><div class="row" id="stg"></div>
  <h2>塗る色</h2><div class="pal" id="pal"></div>
  <h2>再生</h2>
  <div class="row" id="spd"></div>
  <div class="row"><button id="pause">一時停止</button><button id="step">次の段階</button><button id="restart">最初から</button></div>
  <div class="row"><button id="guide" class="on">補助線：オン</button><button id="mirror">左右反転：オフ</button></div>
  <h2>本家の正面キャッチ（いただいた動画より）</h2>
  <div class="info">・体は、ボールが来た方へ向ける（斜め前）。
・ボールを腰〜胸の高さで受け、両腕で下からすくうように抱える。
・抱えたボールは、体の横・前に大きく見える（頭と同じくらいの大きさ）。
・受けた瞬間は、ひざを少し曲げて腰を落とす。</div>
  <h2>書き出し（直した絵を送ってください）</h2>
  <div class="row"><button id="exp">いまの絵を書き出す</button><button id="undo">1つ戻す</button><button id="reset">この絵を最初に戻す</button></div>
  <textarea id="out" readonly placeholder="「いまの絵を書き出す」を押すと、ここに文字で出ます。コピーして送ってください。"></textarea>
  <div class="info" id="stat"></div>
 </div>
</div>
<script>
const DATA0 = {"front": {"base": [".......ooooooooo...........", "......ohhhhhhhhho..........", ".....ohhhhhhhhhhho.........", ".....ohhhhhhhhhhho.........", ".....ohhsessseshho.........", ".....ohssesssessho.........", ".....oSssesssessSo.........", ".....oSssesssessSo.........", ".....oSsssssssssSo.........", "......oSsssssssSo..........", "......oSssSSSsSoo..........", ".....obbrrbbbbbbBo.........", "....obbbrrbbbbbbbBo........", "...obbbbrrbbbbbbbbBo.......", "..obbbbbrrbbbbbbbbbBo......", ".obbbbbbrrbbbbbbbbbbBo.....", ".obbbbbbrrbbbbbbbbbbBo.....", "obbbbbbbrrbbbbbbbbbbbBo....", "obbbbbbbrrbbbbbbbbbbbBo....", "ossssbbbrrbbbbbbbbsssSo....", "ossSobbbbbbbbbbbbbossSo....", ".ooooppppppppppppPoooo.....", "....oppppppppppppPo........", "....oppppppppppppPo........", "....opppppoooppppPo........", "....occcCooooocccCo........", "....occcCo...occcCo........", "....occcCo...occcCo........", "....occcCo...occcCo........", ".....oooo.....oooo.........", "..........................."], "ready": [".......ooooooooo...........", "......ohhhhhhhhho..........", ".....ohhhhhhhhhhho.........", ".....ohhhhhhhhhhho.........", ".....ohhsessseshho.........", ".....ohssesssessho.........", ".....oSssesssessSo.........", ".....oSssesssessSo.........", ".....oSsssssssssSo.........", "......oSsssssssSo..........", "......oSssSSSsSoo..........", ".....obbrrbbbbbbBo.........", "....oBBbrrbbbbbbBBo........", "..oBBBBbrrbbbbbbBBBBo......", "..oBBBBorrbbbbboBBBBo......", "..obBosSrrbbbbbSsoBBo......", "..obbosSrrbbbbbSsobBo......", "..obbosSrrbbbbbSsobBo......", "..obbooorrbbbbbooobBo......", "..obbbbbrrbbbbbbbbbBo......", "..obbbbbbbbbbbbbbbbBo......", "...ooppppppppppppPoo.......", "....oppppppppppppPo........", "....oppppppppppppPo........", "....opppppoooppppPo........", "....occcCooooocccCo........", "....occcCo...occcCo........", "....occcCo...occcCo........", "....occcCo...occcCo........", ".....oooo.....oooo.........", "..........................."], "hold": [".......ooooooooo...........", "......ohhhhhhhhho..........", ".....ohhhhhhhhhhho.........", ".....ohhhhhhhhhhho.........", ".....ohhsessseshho.........", ".....ohssesssessho.........", ".....oSssesssessSo.........", ".....oSssesssessSo.........", ".....oSsssssssssSo.........", "......oSsssssssSo..........", "......oSssSSSsSoo..........", ".....obbrrbbbbbbBo.........", "....oBBbrrbbbbbbBBo........", "..oBBBBbrooooobbBBBBo......", "..oBBBBoowwwwwooBBBBo......", "..obBosSowxxwwoSsoBBo......", "..obbosSowxxwwoSsobBo......", "..obbosSowwwwxoSsobBo......", "..obboooowwwwwoooobBo......", "..obbbbbrooooobbbbbBo......", "..obbbbbbbbbbbbbbbbBo......", "...ooppppppppppppPoo.......", "....oppppppppppppPo........", "....oppppppppppppPo........", "....opppppoooppppPo........", "....occcCooooocccCo........", "....occcCo...occcCo........", "....occcCo...occcCo........", "....occcCo...occcCo........", ".....oooo.....oooo.........", "..........................."]}, "fdiag": {"base": ["..........oooooo...........", ".........ohhhhhho..........", "........ohhhhhhhho.........", ".......ohhhhhhhhhho........", "......oHHHhhhhhhhhho.......", "......oHHHHHsessseSo.......", "......oHHHHHsessseSo.......", ".......oHHHssessseSSo......", "........oHHssessssSSo......", ".........oHssssssssSo......", "..........oHssssssSo.......", "........ooooooooooo........", ".......obbbbbbbbbbbo.......", "......obbbrrbbbbbbbBo......", ".....obbbbrrbbbbbbbBo......", "....obbbbbrrbbbbbbbBoo.....", "....obbbbbrrbbbbbbbbbBo....", "...obbbbbbrrbbbbbbbbBo.....", "...obbbbbbrrbbbbbbbBsso....", "..obbbbbbbrrbbbbbbbBSo.....", "..obbbbbbbrrbbbbbbBoo......", "..osssbbbbrrbbbbbbBo.......", "...oSSobbbbbbbbbbbbo.......", "....oopppppppppppppo.......", ".....oppppppppoppppo.......", ".....oppppppooopccco.......", "......oocccco..occco.......", ".......occcco..occco.......", ".......occcco...ooo........", ".......occcco..............", "........oooo..............."], "ready": ["..........oooooo...........", ".........ohhhhhho..........", "........ohhhhhhhho.........", ".......ohhhhhhhhhho........", "......oHHHhhhhhhhhho.......", "......oHHHHHsessseSo.......", "......oHHHHHsessseSo.......", ".......oHHHssessseSSo......", "........oHHssessssSSo......", ".........oHssssssssSo......", "..........oHssssssSo.......", "........ooooooooooo........", ".......obbbbbbbbbbbo.......", "......obbbrrbbbbbbbBo......", ".....obbbbrrbbbbbbbBBo.....", "....obBbbbrrbbbbbbbBBBo....", "....obbBBbrrbbbbbbbbBBo....", "....obbbbBBrbbbbbbbbbBBo...", "....obbbbbbBBooobbbbbooo...", "....obbbbbbbosSSoooosSSo...", "....obbbbbbbosSSo..osSSo...", "....obbbbbbbboooo...oooo...", "....obbbbbbbbbbbbbbo.......", ".....oopppppppppppppo......", ".....oppppppppoppppo.......", ".....oppppppooopccco.......", "......oocccco..occco.......", ".......occcco..occco.......", ".......occcco...ooo........", ".......occcco..............", "........oooo..............."], "hold": ["..........oooooo...........", ".........ohhhhhho..........", "........ohhhhhhhho.........", ".......ohhhhhhhhhho........", "......oHHHhhhhhhhhho.......", "......oHHHHHsessseSo.......", "......oHHHHHsessseSo.......", ".......oHHHssessseSSo......", "........oHHssessssSSo......", ".........oHssssssssSo......", "..........oHssssssSo.......", "........ooooooooooo........", ".......obbbbbbbbbbbo.......", "......obbbrrbbbbbbbBo......", ".....obbbbrrbbbbbbbBBo.....", "....obBbbbrrbbbboooooBo....", "....obbBBbrrbbbowwwwxooo...", "....obbbbBBrbbowwwwwxxBBo..", "....obbbbbbooowxwwwwwwoBo..", "....obbbbbbosSoxxwwwwwoBo..", "....obbbbbbosSowwwwxwwoBo..", "....obbbbbbboooowwwwwoooo..", "....obbbbbbbbbbooooosSSo...", ".....oopppppppppppooooo....", ".....oppppppppoppppo.......", ".....oppppppooopccco.......", "......oocccco..occco.......", ".......occcco..occco.......", ".......occcco...ooo........", ".......occcco..............", "........oooo..............."]}, "side": {"base": ["...........................", "...........................", "...........................", "...........................", "..........ooooooo..........", ".........ohhhhhhho.........", "........ohhhhhhhhho........", ".......ohhhhhhhhhhho.......", ".......oHhhhhhhhseso.......", ".......oHhhhhhhsseso.......", ".......oHHhhhhhsseso.......", "........oHHhhhhsseso.......", ".........oHhhhhSssso.......", "..........oHhhSsssso.......", ".........oBbbbbbbbo........", ".........oBbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbssssbbo........", "........oBbbSssbbbo........", "........oBbbbbbbbbo........", ".........oPpppppppo........", ".........oPpppppppo........", ".........oppPPPPppo........", "..........oooCccoo.........", "............oCcco..........", "............oCcco..........", ".............ooo..........."], "ready": ["...........................", "...........................", "...........................", "...........................", "..........ooooooo..........", ".........ohhhhhhho.........", "........ohhhhhhhhho........", ".......ohhhhhhhhhhho.......", ".......oHhhhhhhhseso.......", ".......oHhhhhhhsseso.......", ".......oHHhhhhhsseso.......", "........oHHhhhhsseso.......", ".........oHhhhhSssso.......", "..........oHhhSsssso.......", ".........oBbbbbbbbo........", ".........oBbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbssssbbo........", "........oBbbSssbbbo........", "........oBbbbbbbbbo........", ".........oPpppppppo........", ".........oPpppppppo........", ".........oppPPPPppo........", "..........oooCccoo.........", "............oCcco..........", "............oCcco..........", ".............ooo..........."], "hold": ["...........................", "...........................", "...........................", "...........................", "..........ooooooo..........", ".........ohhhhhhho.........", "........ohhhhhhhhho........", ".......ohhhhhhhhhhho.......", ".......oHhhhhhhhseso.......", ".......oHhhhhhhsseso.......", ".......oHHhhhhhsseso.......", "........oHHhhhhsseso.......", ".........oHhhhhSssso.......", "..........oHhhSsssso.......", ".........oBbbbbbbbo........", ".........oBbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbbbbbbbo........", "........oBbbssssbbo........", "........oBbbSssbbbo........", "........oBbbbbbbbbo........", ".........oPpppppppo........", ".........oPpppppppo........", ".........oppPPPPppo........", "..........oooCccoo.........", "............oCcco..........", "............oCcco..........", ".............ooo..........."]}};
const DATA = JSON.parse(JSON.stringify(DATA0));
// 色（GKのユニフォームは黄色の例）
const PAL = { '.': null, o: '#141418', h: '#2a1e18', H: '#1a120e', s: '#a8724e', S: '#86583a', e: '#141414', b: '#f2c230', B: '#c99a1a', r: '#f2c230', p: '#26262c', P: '#18181c', c: '#f2c230', C: '#c99a1a', g: '#f4f4f0', G: '#c8c8c4', w: '#f8f8f4', x: '#48484e' };
const NAMES = { '.': '消す', o: '線', h: '髪', H: '髪(影)', s: '肌', S: '肌(影)', e: '目', b: 'シャツ', B: 'シャツ(影)', r: 'しま', p: 'パンツ', P: 'パンツ(影)', c: 'くつ下', C: 'くつ下(影)', g: '手袋', G: '手袋(影)', w: 'ボール白', x: 'ボール黒' };
const DIRS = [['front', '正面'], ['fdiag', '斜め前'], ['side', '横']], STG = [['ready', '構え'], ['hold', '抱える']];
let dir = 'front', stg = 'hold', paint = 'o', speed = 1, paused = false, guide = true, mirror = false, t = 0, last = performance.now();
const hist = [];
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
// ゲームでは、首より下の「肌(s,S)」はGKの手袋の色になる
const colOf = (rows, r, ch) => { if ((ch === 's' || ch === 'S')) { const neck = rows.findIndex((x) => /[bB]/.test(x)); if (neck >= 0 && r > neck) return ch === 's' ? PAL.g : PAL.G; } return PAL[ch]; };
function drawRows(rows, x0, y0, k, flip) {
  const W = rows[0].length;
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < W; c++) { const ch = rows[r][c]; if (ch === '.') continue; const col = colOf(rows, r, ch); if (!col) continue; ctx.fillStyle = col; const cc = flip ? W - 1 - c : c; ctx.fillRect(Math.round(x0 + cc * k), Math.round(y0 + r * k), Math.ceil(k), Math.ceil(k)); }
}
// 編集する大きな絵
const EK = 15, EX = 20, EY = 40;
function editor() {
  const rows = DATA[dir][stg], W = rows[0].length, H = rows.length;
  ctx.fillStyle = '#3a9a45'; ctx.fillRect(EX, EY, W * EK, H * EK);
  drawRows(rows, EX, EY, EK, false);
  if (guide) { ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; for (let c = 0; c <= W; c++) { ctx.beginPath(); ctx.moveTo(EX + c * EK + .5, EY); ctx.lineTo(EX + c * EK + .5, EY + H * EK); ctx.stroke(); } for (let r = 0; r <= H; r++) { ctx.beginPath(); ctx.moveTo(EX, EY + r * EK + .5); ctx.lineTo(EX + W * EK, EY + r * EK + .5); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(255,224,90,.6)'; ctx.beginPath(); const cx = EX + (dir === 'front' ? 11.5 : dir === 'fdiag' ? 12.5 : 13.5) * EK; ctx.moveTo(cx, EY); ctx.lineTo(cx, EY + H * EK); ctx.stroke(); }
  ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.fillText(`直す絵：${DIRS.find((d) => d[0] === dir)[1]}・${STG.find((s) => s[0] === stg)[1]}（タップで「${NAMES[paint]}」を塗る）`, EX, EY - 12);
}
// 右：動き（ボールが飛んで来て、構え→受ける→抱える）
function anim() {
  const AX = 470, AY = 40, AW = 470, AH = 520;
  ctx.fillStyle = '#2f8a3a'; ctx.fillRect(AX, AY, AW, AH);
  ctx.fillStyle = 'rgba(255,255,255,.08)'; for (let i = 0; i < 6; i++) ctx.fillRect(AX, AY + i * 90, AW, 45);
  const cyc = 3.2, u = (t % cyc) / cyc, ph = u < 0.45 ? 'ready' : 'hold', bu = Math.min(1, u / 0.45);
  for (const [k, gx, gy, label] of [[8, AX + 150, AY + 420, '4倍'], [2.6, AX + 380, AY + 420, 'ゲームと同じ大きさ']]) {
    const rows = DATA[dir][ph], W = rows[0].length, H = rows.length, cx = dir === 'front' ? 11 : dir === 'fdiag' ? 12 : 13;
    ctx.fillStyle = 'rgba(0,30,0,.35)'; ctx.beginPath(); ctx.ellipse(gx, gy, 7 * k, 2.2 * k, 0, 0, 7); ctx.fill();
    drawRows(rows, gx - cx * k, gy - (H - 1) * k, k, mirror);
    if (ph === 'ready') {   // 飛んで来るボール（遠くから、胸の高さへ）
      const bx = gx + (mirror ? -1 : 1) * (dir === 'front' ? 0 : 90 * (1 - bu)) * k / 8, by = gy - 13 * k - (1 - bu) * 110 * k / 8, br = (2 + 1.6 * bu) * k;
      ctx.fillStyle = 'rgba(0,30,0,.3)'; ctx.beginPath(); ctx.ellipse(bx, gy + 4 * k * (1 - bu), br, br * 0.35, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#141418'; ctx.beginPath(); ctx.arc(bx, by, br + k * 0.5, 0, 7); ctx.fill(); ctx.fillStyle = '#f8f8f4'; ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fill(); ctx.fillStyle = '#48484e'; ctx.fillRect(bx - br * 0.3, by - br * 0.3, br * 0.6, br * 0.6);
    }
    ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif'; ctx.fillText(label, gx - 40, AY + 500);
  }
  ctx.fillStyle = '#ffe05a'; ctx.font = '16px sans-serif'; ctx.fillText(ph === 'ready' ? '構え（ボールが来る）' : '受けて、抱える', AX + 12, AY + 26);
}
function frame(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; if (!paused) t += dt * speed; ctx.fillStyle = '#10241a'; ctx.fillRect(0, 0, cv.width, cv.height); editor(); anim(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
// 塗る
function at(ev) { const rc = cv.getBoundingClientRect(), x = (ev.clientX - rc.left) * cv.width / rc.width, y = (ev.clientY - rc.top) * cv.height / rc.height; const rows = DATA[dir][stg]; const c = Math.floor((x - EX) / EK), r = Math.floor((y - EY) / EK); if (r < 0 || c < 0 || r >= rows.length || c >= rows[0].length) return null; return [r, c]; }
let down = false;
function put(ev) { const p = at(ev); if (!p) return; const rows = DATA[dir][stg], [r, c] = p; if (rows[r][c] === paint) return; rows[r] = rows[r].slice(0, c) + paint + rows[r].slice(c + 1); stat(); }
cv.addEventListener('pointerdown', (e) => { if (!at(e)) return; down = true; hist.push([dir, stg, DATA[dir][stg].slice()]); if (hist.length > 80) hist.shift(); put(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => { if (down) put(e); });
cv.addEventListener('pointerup', () => { down = false; });
// ボタン
const mk = (id, list, cur, set) => { const el = document.getElementById(id); el.innerHTML = list.map(([k, n]) => `<button data-k="${k}" class="${k === cur ? 'on' : ''}">${n}</button>`).join(''); el.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; set(b.dataset.k); el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); stat(); }; };
mk('dir', DIRS, dir, (k) => { dir = k; }); mk('stg', STG, stg, (k) => { stg = k; }); mk('spd', [['1', 'ふつう'], ['0.4', 'ゆっくり'], ['0.15', 'とてもゆっくり']], '1', (k) => { speed = +k; });
{ const el = document.getElementById('pal'); el.innerHTML = Object.keys(NAMES).map((k) => `<button data-k="${k}" style="background:${PAL[k] || 'repeating-linear-gradient(45deg,#666 0 4px,#999 4px 8px)'}" class="${k === paint ? 'on' : ''}">${NAMES[k]}</button>`).join(''); el.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; paint = b.dataset.k; el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); }; }
document.getElementById('pause').onclick = (e) => { paused = !paused; e.target.textContent = paused ? '再生' : '一時停止'; };
document.getElementById('step').onclick = () => { paused = true; document.getElementById('pause').textContent = '再生'; const cyc = 3.2, u = (t % cyc) / cyc; t += (u < 0.45 ? 0.45 * cyc - (t % cyc) + 0.01 : cyc - (t % cyc) + 0.01); };
document.getElementById('restart').onclick = () => { t = 0; };
document.getElementById('guide').onclick = (e) => { guide = !guide; e.target.textContent = '補助線：' + (guide ? 'オン' : 'オフ'); e.target.classList.toggle('on', guide); };
document.getElementById('mirror').onclick = (e) => { mirror = !mirror; e.target.textContent = '左右反転：' + (mirror ? 'オン' : 'オフ'); e.target.classList.toggle('on', mirror); };
document.getElementById('undo').onclick = () => { const h = hist.pop(); if (h) DATA[h[0]][h[1]] = h[2]; stat(); };
document.getElementById('reset').onclick = () => { hist.push([dir, stg, DATA[dir][stg].slice()]); DATA[dir][stg] = DATA0[dir][stg].slice(); stat(); };
document.getElementById('exp').onclick = () => { const o = document.getElementById('out'); o.value = JSON.stringify({ dir, stg, rows: DATA[dir][stg] }); o.select(); try { navigator.clipboard.writeText(o.value); } catch (_) {} };
function stat() { const n = (k) => DATA[dir][k].reduce((a, r, i) => a + [...r].filter((ch, j) => ch !== DATA0[dir][k][i][j]).length, 0); document.getElementById('stat').textContent = `いま直している絵：${DIRS.find((d) => d[0] === dir)[1]}・${STG.find((s) => s[0] === stg)[1]}\n最初の絵から変えたドット：構え ${n('ready')}・抱える ${n('hold')}`; }
stat();
</script>
