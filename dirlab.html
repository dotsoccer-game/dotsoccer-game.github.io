<title>走りの向き確認</title>
<style>
:root{--bg:#16241b;--panel:#1f3326;--ink:#eef3ee;--sub:#a9bfae;--acc:#ffd84a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16241b}}
:root[data-theme="dark"]{--bg:#16241b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:14px}

.note{color:var(--sub);line-height:1.7;font-size:13px}button{background:#2c4a36;color:var(--ink);border:1px solid #4d7a5c;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}

</style></head><body><div class="wrap">
<h1>走りの向き確認（本家の動画から写したもの）</h1>
<div class="ctl"><button id="play" class="on">再生中</button><button id="slow">スロー（1/2）</button></div>
<div id="list"></div>
<div class="note">
・どの向きも本家（カルチョビットA）の動画をドット単位で読み取り、全身を1枚ずつ描いています。頭身・服・色はうちの選手（白シャツ・赤い線・青いくつ下）です。<br>
・各カードの左が試合と同じ大きさ（1ドット＝2.6画素）で走る様子、その右が反対向き（左右を写したもの）、右側が4枚の拡大です。<br>
・本家の斜めの走りは「脚を前後に開くコマ」と「両腕を横に広げるコマ」を交互にはさみます（本家どおりに入れています）。<br>
・横向きの走りは、手元の動画に横へ走る場面が見つからず、まだ作っていません。
</div></div>

function sprite(rows, mirror) { const w = rows[0].length, h = rows.length, cv = document.createElement('canvas'); cv.width = w; cv.height = h; const x = cv.getContext('2d'), im = x.createImageData(w, h);
  rows.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '.') return; const cc = mirror ? w - 1 - c : c, i = (r * w + cc) * 4, p = PAL[ch]; im.data[i] = p[0]; im.data[i + 1] = p[1]; im.data[i + 2] = p[2]; im.data[i + 3] = 255; }));
  x.putImageData(im, 0, 0); return cv; }
let playing = true, slow = 1, t = 0, last = 0;
const host = document.getElementById('list');
DIRS.forEach((D) => {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = '<h2>' + D.name + '　<span style="color:#a9bfae;font-size:12px;font-weight:normal">' + D.note + '</span></h2><div class="row"></div>';
  const row = card.querySelector('.row'); host.appendChild(card);
  D.sp = D.frames.map((f) => sprite(f, false)); D.spm = D.frames.map((f) => sprite(f, true));
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; row.appendChild(c); return c.getContext('2d'); };
  D.live = mk(220, 120);
  D.zoom = mk(4 * 140, 220);
});
function draw() {
  DIRS.forEach((D) => {
    const tot = D.dur.reduce((a, b) => a + b, 0); let u = t % tot, f = 0; while (u >= D.dur[f]) { u -= D.dur[f]; f++; }
    const x = D.live; x.imageSmoothingEnabled = false; x.fillStyle = '#3c8f2c'; x.fillRect(0, 0, 220, 120);
    const G = 2.6, put = (img, cx, by, lift) => { x.fillStyle = 'rgba(0,0,0,.28)'; x.beginPath(); x.ellipse(cx, by - 1, 16, 5, 0, 0, 7); x.fill(); x.drawImage(img, Math.round(cx - (D.cx + 0.5) * G), Math.round(by - (28 + lift) * G), img.width * G, img.height * G); };
    put(D.sp[f], 60, 105, D.bob[f]); put(D.spm[f], 160, 105, D.bob[f]);
    const z = D.zoom; z.imageSmoothingEnabled = false; z.fillStyle = '#3c8f2c'; z.fillRect(0, 0, 560, 220);
    D.sp.forEach((img, k) => { const Z = 4.9; z.drawImage(img, 10 + k * 138, 200 - (28 + D.bob[k]) * Z, img.width * Z, img.height * Z); z.fillStyle = k === f ? '#ffd84a' : '#fff'; z.font = '12px sans-serif'; z.fillText(D.names[k], 12 + k * 138, 14); });
    z.fillStyle = 'rgba(255,255,255,.5)'; z.fillRect(0, 200, 560, 1);
  });
}
function loop(now) { const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now; if (playing) t += dt * slow; draw(); requestAnimationFrame(loop); }
document.getElementById('play').onclick = (e) => { playing = !playing; e.target.textContent = playing ? '再生中' : '一時停止'; e.target.classList.toggle('on', playing); };
document.getElementById('slow').onclick = (e) => { slow = slow === 1 ? 0.5 : 1; e.target.classList.toggle('on', slow !== 1); };
requestAnimationFrame(loop);
