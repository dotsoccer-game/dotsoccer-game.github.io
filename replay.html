<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d6b32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ドットサッカー"><title>試合で確認</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"><link rel="stylesheet" href="style.css?v=20261008-340"></head>
<body><main id="app">
 <header><div class="brand"><span class="crest">H</span><div><b>はじまりFC</b><small>タイプで動きが変わる、90分。</small></div></div><div class="head-btns"><button id="goCareer" class="quiet">育成モード</button><button id="newGame" class="quiet">フリー試合</button></div></header>
 <button id="mMenu" class="m-menu" type="button">メニュー</button>
 <div id="mSheet" class="modal" hidden><div class="sheet"><h2>メニュー</h2><div class="mlist"><button data-m="career" class="primary">ホーム（育成モード）</button><button data-m="free">フリー試合</button><button data-m="fs" id="mFull">全画面にする</button><button data-m="close">閉じる</button></div></div></div>
 <section id="setup" class="setup"><div class="setup-card"><p class="eyebrow">試合の日</p><h1>試合をはじめよう</h1><p>個性の違う16人が、ピッチでどんな動きをするか見てみよう。</p><label>選手のレベル<select id="level"><option value="low">育成序盤（ほぼD〜E）</option><option value="s">オールS同士（カルチョビットAの動画と同じ）</option><option value="vs">自分は育成序盤・相手はオールS</option></select></label><label>対戦相手<select id="opponent"><option>バランス型</option><option>堅守型</option><option>パス型</option><option>プレス型</option><option>走力型</option><option>裏抜け型</option></select></label><div class="seed"><label>試合シード（空欄なら毎回ちがう試合）<input id="seed" type="number" value="" min="1" placeholder="空欄＝毎回ちがう試合"></label><button id="start" class="primary">キックオフ</button></div><p id="startupError" class="startup-error" role="alert" hidden></p></div><div id="roster" class="roster"></div></section>
 <section id="career" class="career2" hidden>
  <div id="cv-home" class="cv">
   <canvas id="homeCv" width="1280" height="720"></canvas>
   <div class="hm-date"><b id="hmMonth">3</b><span>月</span><b id="hmWeek">1</b><span>週</span><button id="hmNext" class="hm-adv" title="練習して1週間すすめる">▶</button></div>
   <div class="hm-next" id="hmNextMatch"></div>
   <div class="hm-ticker"><i class="guide"><svg viewBox="0 0 64 64" class="g-ball"><circle cx="32" cy="30" r="27" fill="#fff" stroke="#222" stroke-width="3"/><polygon points="32,20 41,27 38,38 26,38 23,27" fill="#222"/><path d="M32 3v17M59 24l-18 3M50 54l-12-16M14 54l12-16M5 24l18 3" stroke="#222" stroke-width="3"/></svg><svg viewBox="0 0 30 40" class="g-mark"><path d="M2 2l13 9 13-9v26l-13 10L2 28z" fill="#2fb84a" stroke="#fff" stroke-width="2"/><path d="M15 11v27L2 28V2z" fill="#ffd400" stroke="#fff" stroke-width="2"/></svg><span>ドット<br>ガイド</span></i><div class="tk"><span id="hmTicker"></span></div></div>
  </div>
  <div id="cv-club" class="cv" hidden>
   <canvas id="clubCv" width="1280" height="720"></canvas>
   <div class="rbtns"><button data-go="data"><canvas id="rbData" width="60" height="46"></canvas><b>選手データ</b></button><button data-go="lineup"><span id="rbLineup"></span><b>スタメン</b></button><button data-go="train"><canvas id="rbTrain" width="60" height="50"></canvas><b>特訓</b></button><button data-go="tactic"><span id="rbTac"></span><b>戦術</b></button></div>
   <div id="clubLayer" class="club-layer"></div>
  </div>
  <button id="cvBack" class="cv-back" hidden title="もどる">↩</button>
  <div id="crModal" class="modal" hidden><div class="sheet"><div id="crModalBody"></div></div></div>
 </section>
 <section id="match" hidden>
  <div class="match-shell"><div class="viewport"><canvas id="pitch" width="1280" height="720" aria-label="サッカーの試合画面"></canvas>
   <div class="scorebar"><span id="homeName">はじまり</span><strong><i id="hs">0</i><em>−</em><i id="as">0</i></strong><span id="awayName">相手</span><time id="clock">00:00</time></div>
   <div id="policy" class="policy"></div><div id="goal" class="goal"><strong>1 − 0</strong><span>決まったぁ！</span></div><div id="scorer" class="scorer"></div><div id="subCard" class="subcard"></div><div id="subLed" class="subled"></div>
   <div id="coach" class="coach"><div class="issue-card"><b id="coachCard">カード</b><i id="coachIcon">★</i></div><div class="bubble"><p></p></div></div>
   <aside><button data-panel="subs" title="選手交代"><img src="icons/btn_change.png" alt=""><b>選手交代</b></button><button data-panel="players" title="選手"><img src="icons/btn_players.png" alt=""><b>選手</b></button><button data-panel="status" title="状況"><img src="icons/btn_status.png" alt=""><b>状況</b></button></aside>
  </div></div>
  <div class="controls"><button id="pause">一時停止</button><div class="speeds"><button data-speed="1" class="active">1倍</button><button data-speed="4">4倍</button><button data-speed="16">16倍</button></div><div class="speeds zooms"><button data-zoom="near">近い</button><button data-zoom="normal" class="active">ふつう</button><button data-zoom="far">遠い</button></div><button id="skip">結果まで</button><span class="hint">選手をタップすると動きを追えます</span></div>
 </section>
 <section id="result" hidden><div class="result-card"><p class="eyebrow">試合終了</p><div class="final-score"><span>はじまり</span><strong id="finalScore">0 − 0</strong><span id="finalOpponent">相手</span></div><div id="statTable"></div><h2>得点</h2><div id="goalsList"></div><h2>見つかった課題</h2><div id="cards"></div><button id="again" class="primary">もう一度試合</button></div></section>
 <div id="panel" class="modal" hidden><div class="sheet"><button class="close" aria-label="閉じる">×</button><div id="panelContent"></div></div></div>
 <div id="half" class="modal" hidden><div class="locker"><div class="locker-art"><span>▥</span><span>▥</span><span>▥</span></div><p class="eyebrow">ハーフタイム</p><h2>前半終了</h2><div id="halfStats" class="half-stats"></div><p>選手の疲労を確認して、後半へ進みましょう。</p><div class="half-actions"><button data-panel="players">選手の疲労</button><button data-panel="subs">選手交代</button><button id="htTac" hidden>選手交代</button><button id="second" class="primary">後半開始</button></div></div></div>
 </main>
 <div id="rotate"><div><span class="ph"></span>スマホを横向きにしてね<br><small>横画面で遊ぶゲームです</small></div></div><script src="engine/engine.js?v=20261008-340"></script><script src="sprites/gpt.js?v=20261008-340"></script><script src="sprites/run_art.js?v=20261008-340"></script><script src="sprites/dotman.js?v=20261008-340"></script><script src="app.js?v=20261008-340"></script><script src="teams.js?v=20261008-340"></script><script src="rosters.js?v=20261008-340"></script><script src="career.js?v=20261008-340"></script><script src="faces/faces.js?v=20261008-340"></script><script src="career-ui.js?v=20261008-340"></script><script src="replay.js?v=20261008-340"></script></body></html>
